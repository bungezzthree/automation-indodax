# Default run configuration (CLI flags override these).
# Step profile (users/load_shapes.py) ramps 2 -> 5 -> 8 -> 10 RPS over 150 s.
locustfile = locustfile.py
headless = true
host = https://dummy.restapiexample.com
users = 10
spawn-rate = 2
run-time = 3m
csv = results/locust
csv-full-history = true
html = results/report.html
loglevel = INFO
logfile = results/locust.log
stop-timeout = 5
